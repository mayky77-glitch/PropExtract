name: Windows offline smoke

on:
  push:
    branches:
      - main
      - codex/admin-ui
    paths:
      - ".github/workflows/windows-smoke.yml"
      - "install_windows.*"
      - "start_windows.*"
      - "stop_windows.*"
      - "*PropExtract.cmd"
      - "windows_runtime_helpers.ps1"
      - "windows-runtime.lock.json"
      - "packages/**"
      - "requirements-rns-import.txt"
      - "rns_import_server/**"
      - "scripts/build_windows_*"
      - "scripts/windows_ocr_stdio_probe.py"
      - "scripts/windows_end_to_end_smoke.py"
      - "tests/test_admin_server.py"
      - "tests/test_ocr_resource_limits.py"
      - "tests/test_windows_installer_contract.py"
      - "tests/test_lifecycle_contract.py"
      - "README.md"
  pull_request:
    paths:
      - ".github/workflows/windows-smoke.yml"
      - "install_windows.*"
      - "start_windows.*"
      - "stop_windows.*"
      - "*PropExtract.cmd"
      - "windows_runtime_helpers.ps1"
      - "windows-runtime.lock.json"
      - "packages/**"
      - "requirements-rns-import.txt"
      - "rns_import_server/**"
      - "scripts/build_windows_*"
      - "scripts/windows_ocr_stdio_probe.py"
      - "scripts/windows_end_to_end_smoke.py"
      - "tests/test_admin_server.py"
      - "tests/test_ocr_resource_limits.py"
      - "tests/test_windows_installer_contract.py"
      - "tests/test_lifecycle_contract.py"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-install:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Reproduce installation from a source archive
        shell: powershell
        run: |
          $ProgressPreference = "SilentlyContinue"
          $env:CI = "true"
          $archiveId = [Guid]::NewGuid().ToString("N")
          $archive = Join-Path $env:RUNNER_TEMP ("propextract-codeload-" + $archiveId + ".zip")
          $unicodeFolder = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String("0JDRgNGF0LjQsiAmINGD0YHRgtCw0L3QvtCy0LrQsCAoMTUp")) + " " + $archiveId
          $destination = Join-Path $env:RUNNER_TEMP $unicodeFolder
          $sourceArchiveUrl = "https://codeload.github.com/$env:GITHUB_REPOSITORY/zip/$env:GITHUB_SHA"
          Invoke-WebRequest -UseBasicParsing -Uri $sourceArchiveUrl -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $roots = @(Get-ChildItem -LiteralPath $destination -Directory -Force)
          if ($roots.Count -ne 1) { throw "codeload archive must contain exactly one root directory; found $($roots.Count)" }
          $root = $roots[0].FullName
          $installer = Join-Path $root "install_windows.cmd"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw "codeload archive lacks install_windows.cmd" }

          $lock = Get-Content -LiteralPath (Join-Path $root "windows-runtime.lock.json") -Raw | ConvertFrom-Json
          $vcRuntime = $lock.artifacts.vcruntime
          if ($vcRuntime.filename -ne "vc_runtimeMinimum_x64.zip" -or $vcRuntime.path -ne "packages/windows/vc_runtimeMinimum_x64.zip") {
            throw "codeload runtime lock no longer points to vc_runtimeMinimum_x64.zip"
          }
          if ($vcRuntime.sha256 -ne "05d023de0a652a64369e9bbef971281ffd4042fd722528f194234aae5864fbcf") {
            throw "codeload VC runtime ZIP hash is not the pinned value"
          }
          $vcArchive = Join-Path $root $vcRuntime.path
          if (-not (Test-Path -LiteralPath $vcArchive -PathType Leaf)) { throw "codeload archive lacks the pinned VC runtime ZIP" }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $vcArchive).Hash.ToLowerInvariant() -ne $vcRuntime.sha256) {
            throw "codeload VC runtime ZIP bytes do not match its lock hash"
          }
          $installerSource = Get-Content -LiteralPath (Join-Path $root "install_windows.ps1") -Raw
          if ($installerSource -notmatch 'Expand-Archive\s+-LiteralPath\s+\$VcRuntimeArchive\s+-DestinationPath\s+\$PopplerBin\s+-Force') {
            throw "installer no longer uses Unicode-safe Expand-Archive for the VC runtime"
          }
          if ($installerSource -match '(?i)expand\.exe|VcRuntimeCab') {
            throw "installer contains a legacy VC extraction token"
          }

          $assocOutput = & "$env:ComSpec" /d /c "assoc .cmd" 2>&1 | Out-String
          $assocExitCode = $LASTEXITCODE
          Write-Host "cmd /d /c assoc .cmd (exit $assocExitCode):`n$assocOutput"
          $ftypeOutput = & "$env:ComSpec" /d /c "ftype cmdfile" 2>&1 | Out-String
          $ftypeExitCode = $LASTEXITCODE
          Write-Host "cmd /d /c ftype cmdfile (exit $ftypeExitCode):`n$ftypeOutput"

          function Get-ArchiveInstallerLogTail([string]$Path) {
            if (Test-Path -LiteralPath $Path -PathType Leaf) {
              return Get-Content -LiteralPath $Path -Tail 150 | Out-String
            }
            return "install-windows.log was not created"
          }

          function Invoke-ShellExecuteCmdProbe([string]$Name, [string]$Path, [string]$MarkerPath) {
            Remove-Item -LiteralPath $MarkerPath -Force -ErrorAction SilentlyContinue
            $previousMarker = [Environment]::GetEnvironmentVariable("PROPEXTRACT_SHELLEXEC_MARKER", "Process")
            [Environment]::SetEnvironmentVariable("PROPEXTRACT_SHELLEXEC_MARKER", $MarkerPath, "Process")
            try {
              $probeProcess = Start-Process -FilePath $Path -Verb Open -WorkingDirectory $env:RUNNER_TEMP -PassThru
              $deadline = [DateTime]::UtcNow.AddSeconds(15)
              while (-not $probeProcess.HasExited -and [DateTime]::UtcNow -lt $deadline) {
                Start-Sleep -Milliseconds 100
              }
              if (-not $probeProcess.HasExited) {
                Stop-Process -Id $probeProcess.Id -Force
                throw "$Name ShellExecute probe did not exit within 15 seconds"
              }
              if ($probeProcess.ExitCode -ne 0) { throw "$Name ShellExecute probe exited $($probeProcess.ExitCode)" }
              if (-not (Test-Path -LiteralPath $MarkerPath -PathType Leaf)) { throw "$Name ShellExecute probe did not create its marker" }
              if ((Get-Content -LiteralPath $MarkerPath -Raw).Trim() -ne "shell-execute-ok") { throw "$Name ShellExecute probe marker is invalid" }
              Write-Host "$Name ShellExecute probe passed"
            } finally {
              [Environment]::SetEnvironmentVariable("PROPEXTRACT_SHELLEXEC_MARKER", $previousMarker, "Process")
            }
          }

          $probeRoot = Join-Path $env:RUNNER_TEMP ("propextract-shell-probe-" + [Guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $probeRoot -Force | Out-Null
          $asciiProbe = Join-Path $probeRoot "shell-open-probe.cmd"
          $complexProbe = Join-Path $root "shell-open-probe.cmd"
          $probeBytes = [Convert]::FromBase64String("QGVjaG8gb2ZmDQo+ICIlUFJPUEVYVFJBQ1RfU0hFTExFWEVDX01BUktFUiUiIGVjaG8gc2hlbGwtZXhlY3V0ZS1vaw0KZXhpdCAvYiAwDQo=")
          [IO.File]::WriteAllBytes($asciiProbe, $probeBytes)
          [IO.File]::WriteAllBytes($complexProbe, $probeBytes)
          if ((Get-FileHash -LiteralPath $asciiProbe -Algorithm SHA256).Hash -ne (Get-FileHash -LiteralPath $complexProbe -Algorithm SHA256).Hash) {
            throw "ShellExecute probe batches are not byte-identical"
          }
          Invoke-ShellExecuteCmdProbe "ASCII path" $asciiProbe (Join-Path $probeRoot "ascii-probe.marker")
          Invoke-ShellExecuteCmdProbe "complex codeload path" $complexProbe (Join-Path $probeRoot "complex-probe.marker")

          $installLog = Join-Path $root "install-windows.log"
          $archiveRuntimeRoot = Join-Path $root ".runtime\windows"
          $pythonRoot = Join-Path $archiveRuntimeRoot ("python-" + $lock.artifacts.python.version)
          $pythonRuntime = Join-Path $pythonRoot "python.exe"
          $nativeRoot = Join-Path $archiveRuntimeRoot ("native-" + $lock.runtime)
          $nativeRuntime = Join-Path (Join-Path $nativeRoot $lock.nativeTree.popplerBinPath) "pdfinfo.exe"
          . (Join-Path $root "windows_runtime_helpers.ps1")
          $currentInstallerBytes = [IO.File]::ReadAllBytes($installer)
          $currentCrlfCount = 0
          $currentLoneLfCount = 0
          for ($index = 0; $index -lt $currentInstallerBytes.Length; $index++) {
            if ($currentInstallerBytes[$index] -eq 10) {
              if ($index -gt 0 -and $currentInstallerBytes[$index - 1] -eq 13) { $currentCrlfCount++ } else { $currentLoneLfCount++ }
            }
          }
          if ($currentCrlfCount -eq 0 -or $currentLoneLfCount -ne 0) { throw "current codeload install_windows.cmd is not CRLF-only" }
          Write-Host "current codeload install_windows.cmd CRLF=$currentCrlfCount loneLF=$currentLoneLfCount"

          $legacyProbe = Join-Path $root "legacy-crlf-only-install.cmd"
          $legacyBytes = [Convert]::FromBase64String("")
          $legacyCrlfBytes = New-Object 'System.Collections.Generic.List[byte]'
          foreach ($legacyByte in $legacyBytes) {
            if ($legacyByte -eq 10) { [void]$legacyCrlfBytes.Add([byte]13) }
            [void]$legacyCrlfBytes.Add($legacyByte)
          }
          [IO.File]::WriteAllBytes($legacyProbe, $legacyCrlfBytes.ToArray())
          $legacyLogObserved = $false
          $legacyRuntimeVerified = $false
          $legacyHealthObserved = $false
          $legacyOutcome = "failed"
          $legacyDetails = "not started"
          $legacyProcess = $null
          try {
            $legacyProcess = Start-Process -FilePath $legacyProbe -Verb Open -WorkingDirectory $env:RUNNER_TEMP -PassThru
            $legacyDeadline = [DateTime]::UtcNow.AddSeconds(120)
            while ([DateTime]::UtcNow -lt $legacyDeadline) {
              $legacyLogObserved = $legacyLogObserved -or (Test-Path -LiteralPath $installLog -PathType Leaf)
              if (-not $legacyRuntimeVerified -and (Test-Path -LiteralPath $pythonRuntime -PathType Leaf) -and (Test-Path -LiteralPath $nativeRuntime -PathType Leaf)) {
                $legacyRuntimeVerified = (Test-PropExtractPythonTree $pythonRoot $lock) -and (Test-PropExtractNativeTree $nativeRoot $lock)
              }
              if ($legacyRuntimeVerified) {
                try {
                  $legacyHealthResponse = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8775/health" -TimeoutSec 2
                  $legacyHealth = $legacyHealthResponse.Content | ConvertFrom-Json
                  if ($legacyHealth.status -eq "ok" -and $legacyHealth.service -eq "rns-import") { $legacyHealthObserved = $true; break }
                } catch { }
              }
              if ($legacyProcess.HasExited) { break }
              Start-Sleep -Milliseconds 500
            }
            if ($legacyHealthObserved) {
              $legacyShutdown = Invoke-WebRequest -UseBasicParsing -Method Post -Uri "http://127.0.0.1:8775/api/shutdown" -Headers @{ "X-PropExtract-Action" = "shutdown" } -ContentType "application/json" -Body "{}" -TimeoutSec 8
              if ($legacyShutdown.StatusCode -ne 202) { throw "shutdown returned HTTP $($legacyShutdown.StatusCode)" }
              $legacyExitDeadline = [DateTime]::UtcNow.AddSeconds(30)
              while (-not $legacyProcess.HasExited -and [DateTime]::UtcNow -lt $legacyExitDeadline) { Start-Sleep -Milliseconds 250 }
              if (-not $legacyProcess.HasExited) { throw "process did not exit after shutdown" }
              if ($legacyProcess.ExitCode -ne 0) { throw "process exited $($legacyProcess.ExitCode) after shutdown" }
              $legacyOutcome = "passed"
              $legacyDetails = "log=$legacyLogObserved runtime=$legacyRuntimeVerified health=$legacyHealthObserved exit=$($legacyProcess.ExitCode)"
            } else {
              $legacyExit = if ($legacyProcess.HasExited) { [string]$legacyProcess.ExitCode } else { "running at timeout" }
              $legacyDetails = "log=$legacyLogObserved runtime=$legacyRuntimeVerified health=$legacyHealthObserved exit=$legacyExit"
              if (-not $legacyProcess.HasExited) { Stop-Process -Id $legacyProcess.Id -Force }
            }
          } catch {
            $legacyExit = if ($legacyProcess -and $legacyProcess.HasExited) { [string]$legacyProcess.ExitCode } else { "unavailable" }
            $legacyDetails = "log=$legacyLogObserved runtime=$legacyRuntimeVerified health=$legacyHealthObserved exit=$legacyExit error=$($_.Exception.Message)"
            if ($legacyProcess -and -not $legacyProcess.HasExited) { Stop-Process -Id $legacyProcess.Id -Force }
          }
          Write-Host "legacy CRLF-only ${legacyOutcome}: $legacyDetails"
          Remove-Item -LiteralPath $installLog -Force -ErrorAction SilentlyContinue

          # The explicit Open verb uses Windows ShellExecute file association, matching
          # Explorer's no-argument handling of an absolute .cmd path. This must be the
          # first launch against the clean archive root.
          $shellExecute = Start-Process -FilePath $installer -Verb Open -WorkingDirectory $env:RUNNER_TEMP -PassThru
          $runtimeVerified = $false
          $healthReady = $false
          $healthDeadline = [DateTime]::UtcNow.AddSeconds(180)
          while ([DateTime]::UtcNow -lt $healthDeadline) {
            if ($shellExecute.HasExited) { break }
            if (-not $runtimeVerified -and (Test-Path -LiteralPath $pythonRuntime -PathType Leaf) -and (Test-Path -LiteralPath $nativeRuntime -PathType Leaf)) {
              $runtimeVerified = (Test-PropExtractPythonTree $pythonRoot $lock) -and (Test-PropExtractNativeTree $nativeRoot $lock)
            }
            if ($runtimeVerified) {
              try {
                $healthResponse = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8775/health" -TimeoutSec 2
                $health = $healthResponse.Content | ConvertFrom-Json
                if ($health.status -eq "ok" -and $health.service -eq "rns-import") {
                  $healthReady = $true
                  break
                }
              } catch { }
            }
            Start-Sleep -Milliseconds 500
          }
          if (-not $healthReady) {
            $processExit = if ($shellExecute.HasExited) { [string]$shellExecute.ExitCode } else { "still running after health timeout" }
            throw "ShellExecute no-argument installer did not become healthy (process exit: $processExit). Installer log tail:`n$(Get-ArchiveInstallerLogTail $installLog)"
          }
          if (-not (Test-Path -LiteralPath $installLog -PathType Leaf)) { throw "ShellExecute installer became healthy without install-windows.log" }
          $currentInstance = [string]$healthResponse.Headers["X-PropExtract-Instance"]
          if ($currentInstance -notmatch '^[0-9a-f]{64}$') { throw "ShellExecute health response lacks the expected instance identifier" }
          $stopLauncherName = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String("0J7RgdGC0LDQvdC+0LLQuNGC0YwgUHJvcEV4dHJhY3QuY21k"))
          $startLauncherName = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String("0JfQsNC/0YPRgdGC0LjRgtGMIFByb3BFeHRyYWN0LmNtZA=="))
          $stopLauncher = Join-Path $root $stopLauncherName
          $startLauncher = Join-Path $root $startLauncherName
          if (-not (Test-Path -LiteralPath $stopLauncher -PathType Leaf) -or -not (Test-Path -LiteralPath $startLauncher -PathType Leaf)) {
            throw "codeload archive lacks a user-facing lifecycle launcher"
          }
          $stopProcess = Start-Process -FilePath $stopLauncher -Verb Open -WorkingDirectory $env:RUNNER_TEMP -PassThru
          $exitDeadline = [DateTime]::UtcNow.AddSeconds(30)
          while (-not $stopProcess.HasExited -and [DateTime]::UtcNow -lt $exitDeadline) {
            Start-Sleep -Milliseconds 250
          }
          if (-not $stopProcess.HasExited -or $stopProcess.ExitCode -ne 0) {
            $stopExit = if ($stopProcess.HasExited) { [string]$stopProcess.ExitCode } else { "timeout" }
            throw "ShellExecute user stop launcher failed with exit $stopExit"
          }
          $instanceStopped = $false
          $stopHealthDeadline = [DateTime]::UtcNow.AddSeconds(15)
          while ([DateTime]::UtcNow -lt $stopHealthDeadline) {
            try {
              $stoppedHealthResponse = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8775/health" -TimeoutSec 2
              $stoppedInstance = [string]$stoppedHealthResponse.Headers["X-PropExtract-Instance"]
              if ($stoppedInstance -ne $currentInstance) { $instanceStopped = $true; break }
            } catch {
              $instanceStopped = $true
              break
            }
            Start-Sleep -Milliseconds 250
          }
          if (-not $instanceStopped) { throw "ShellExecute user stop launcher did not remove the running instance" }
          while (-not $shellExecute.HasExited -and [DateTime]::UtcNow -lt $exitDeadline) {
            Start-Sleep -Milliseconds 250
          }
          if (-not $shellExecute.HasExited) {
            throw "ShellExecute no-argument installer did not exit after user stop. Installer log tail:`n$(Get-ArchiveInstallerLogTail $installLog)"
          }
          if ($shellExecute.ExitCode -ne 0) {
            throw "ShellExecute no-argument installer failed with exit code $($shellExecute.ExitCode) after user stop. Installer log tail:`n$(Get-ArchiveInstallerLogTail $installLog)"
          }
          $restartProcess = Start-Process -FilePath $startLauncher -Verb Open -WorkingDirectory $env:RUNNER_TEMP -PassThru
          $restartReady = $false
          $restartDeadline = [DateTime]::UtcNow.AddSeconds(45)
          while ([DateTime]::UtcNow -lt $restartDeadline) {
            if ($restartProcess.HasExited) { break }
            try {
              $restartHealthResponse = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8775/health" -TimeoutSec 2
              $restartHealth = $restartHealthResponse.Content | ConvertFrom-Json
              $restartInstance = [string]$restartHealthResponse.Headers["X-PropExtract-Instance"]
              if ($restartHealth.status -eq "ok" -and $restartHealth.service -eq "rns-import" -and $restartInstance -eq $currentInstance) {
                $restartReady = $true
                break
              }
            } catch { }
            Start-Sleep -Milliseconds 250
          }
          if (-not $restartReady) {
            $restartExit = if ($restartProcess.HasExited) { [string]$restartProcess.ExitCode } else { "timeout" }
            throw "ShellExecute user start launcher did not restore health (exit $restartExit)"
          }
          $finalStopProcess = Start-Process -FilePath $stopLauncher -Verb Open -WorkingDirectory $env:RUNNER_TEMP -PassThru
          $finalStopDeadline = [DateTime]::UtcNow.AddSeconds(30)
          while (-not $finalStopProcess.HasExited -and [DateTime]::UtcNow -lt $finalStopDeadline) { Start-Sleep -Milliseconds 250 }
          if (-not $finalStopProcess.HasExited -or $finalStopProcess.ExitCode -ne 0) {
            $finalStopExit = if ($finalStopProcess.HasExited) { [string]$finalStopProcess.ExitCode } else { "timeout" }
            throw "ShellExecute final user stop launcher failed with exit $finalStopExit"
          }
          while (-not $restartProcess.HasExited -and [DateTime]::UtcNow -lt $finalStopDeadline) { Start-Sleep -Milliseconds 250 }
          if (-not $restartProcess.HasExited -or $restartProcess.ExitCode -ne 0) {
            $restartExit = if ($restartProcess.HasExited) { [string]$restartProcess.ExitCode } else { "timeout" }
            throw "ShellExecute user start launcher did not exit cleanly after final stop (exit $restartExit)"
          }

          $transcript = Join-Path $destination "absolute-cmd-install-transcript.log"
          $installerEnvName = "PROPEXTRACT_ABSOLUTE_INSTALLER"
          $previousInstallerEnv = [Environment]::GetEnvironmentVariable($installerEnvName, "Process")
          [Environment]::SetEnvironmentVariable($installerEnvName, $installer, "Process")
          Push-Location $env:RUNNER_TEMP
          try {
            $oldErrorActionPreference = $ErrorActionPreference
            $ErrorActionPreference = "Continue"
            $output = & "$env:ComSpec" /d /s /c 'call "%PROPEXTRACT_ABSOLUTE_INSTALLER%" -NoStart' 2>&1 | Out-String
            $exitCode = $LASTEXITCODE
            $ErrorActionPreference = $oldErrorActionPreference
            Set-Content -LiteralPath $transcript -Value $output -Encoding utf8
            Write-Host $output
            if ($exitCode -ne 0) {
              $tail = Get-Content -LiteralPath $transcript -Tail 150 | Out-String
              throw "absolute codeload CMD installer failed with exit code $exitCode. Transcript tail:`n$tail"
            }
          } finally {
            Pop-Location
            [Environment]::SetEnvironmentVariable($installerEnvName, $previousInstallerEnv, "Process")
          }
      - name: Run the one-click installer without WinGet or network downloads
        shell: powershell
        run: |
          Remove-Item Env:\PYTHONDONTWRITEBYTECODE, Env:\TESSDATA_PREFIX -ErrorAction SilentlyContinue
          $oldErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          $output = & "$env:ComSpec" /d /c "call install_windows.cmd -NoStart" 2>&1 | Out-String
          $exitCode = $LASTEXITCODE
          $ErrorActionPreference = $oldErrorActionPreference
          Write-Host $output
          if ($exitCode -ne 0) {
            $details = $output
            if (Test-Path -LiteralPath .\install-windows.log -PathType Leaf) {
              $details += "`n--- install-windows.log ---`n"
              $details += (Get-Content -LiteralPath .\install-windows.log -Tail 100 | Out-String)
            }
            $details = $details.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=PropExtract Windows installer failed::$details"
            exit $exitCode
          }
      - name: Re-run a healthy installation
        shell: cmd
        run: install_windows.cmd -NoStart
      - name: Simulate antivirus loss and local corruption
        shell: powershell
        run: |
          $lock = Get-Content .\windows-runtime.lock.json -Raw | ConvertFrom-Json
          $python = ".runtime\windows\python-$($lock.artifacts.python.version)\python312._pth"
          $native = ".runtime\windows\native-$($lock.runtime)"
          $pdfinfo = Join-Path $native (Join-Path $lock.nativeTree.popplerBinPath "pdfinfo.exe")
          [IO.File]::AppendAllText($python, "tamper")
          Remove-Item -LiteralPath $pdfinfo -Force
      - name: Repair both tampered runtimes
        shell: cmd
        run: install_windows.cmd -NoStart
      - name: Verify app-local runtime files and tree digests
        shell: powershell
        run: |
          . .\windows_runtime_helpers.ps1
          $lock = Get-Content .\windows-runtime.lock.json -Raw | ConvertFrom-Json
          $python = Join-Path $PWD (".runtime\windows\python-" + $lock.artifacts.python.version)
          $native = Join-Path $PWD (".runtime\windows\native-" + $lock.runtime)
          if (-not (Test-PropExtractPythonTree $python $lock)) { throw "python tree digest mismatch" }
          if (-not (Test-PropExtractNativeTree $native $lock)) { throw "native tree digest mismatch" }
          $poppler = Join-Path $native $lock.nativeTree.popplerBinPath
          foreach ($name in @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll")) {
            if (-not (Test-Path -LiteralPath (Join-Path $poppler $name) -PathType Leaf)) {
              throw "missing app-local VC runtime file: $name"
            }
          }
          $stale = @(
            Get-ChildItem -LiteralPath (Join-Path $PWD ".runtime\windows") -Directory -Force |
              Where-Object { $_.Name -match '^.+\.invalid\.\d{8}-\d{6}\.[0-9a-f]{32}$' }
          )
          if ($stale.Count -ne 0) {
            throw "repair left stale invalid runtime backup(s): $($stale.Name -join ', ')"
          }
      - name: Check the normal CMD launcher without opening a browser
        shell: powershell
        run: |
          $oldErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          $output = & "$env:ComSpec" /d /c "call start_windows.cmd -NoBrowser -CheckOnly" 2>&1 | Out-String
          $exitCode = $LASTEXITCODE
          $ErrorActionPreference = $oldErrorActionPreference
          Write-Host $output
          if ($exitCode -ne 0) {
            $details = $output.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=PropExtract Windows launcher failed::$details"
            exit $exitCode
          }
      - name: Recheck server imports and OCR runtime
        shell: powershell
        run: |
          $lock = Get-Content .\windows-runtime.lock.json -Raw | ConvertFrom-Json
          $python = ".runtime\windows\python-$($lock.artifacts.python.version)\python.exe"
          $env:PYTHONDONTWRITEBYTECODE = "1"
          & $python -B -S -c "import openpyxl, rns_import_server.server"
          if ($LASTEXITCODE -ne 0) { throw "server import failed" }
          & $python -B -S -m rns_import_server.runtime
          if ($LASTEXITCODE -ne 0) { throw "runtime check failed" }
      - name: Verify blank and recognized Tesseract stdout through portable Python
        shell: powershell
        run: |
          $lock = Get-Content .\windows-runtime.lock.json -Raw | ConvertFrom-Json
          $python = ".runtime\windows\python-$($lock.artifacts.python.version)\python.exe"
          $env:PYTHONDONTWRITEBYTECODE = "1"
          & $python -B -S -m scripts.windows_ocr_stdio_probe
          if ($LASTEXITCODE -ne 0) { throw "Tesseract stdout probe failed" }
      - name: Exercise real portable PDF-to-XLSX publication and no-op
        shell: powershell
        run: |
          $lock = Get-Content .\windows-runtime.lock.json -Raw | ConvertFrom-Json
          $python = ".runtime\windows\python-$($lock.artifacts.python.version)\python.exe"
          $env:PYTHONDONTWRITEBYTECODE = "1"
          & $python -B -S scripts\windows_end_to_end_smoke.py
          if ($LASTEXITCODE -ne 0) { throw "portable PDF-to-XLSX smoke failed" }
      - name: Verify installer preflight and same-project mutex
        shell: powershell
        run: |
          . .\windows_runtime_helpers.ps1
          $lock = Get-Content .\windows-runtime.lock.json -Raw | ConvertFrom-Json
          $root = (Get-Location).Path
          $runtimeRoot = Join-Path $root ".runtime\windows"
          $pythonRoot = Join-Path $runtimeRoot ("python-" + $lock.artifacts.python.version)
          $nativeRoot = Join-Path $runtimeRoot ("native-" + $lock.runtime)
          Assert-PropExtractInstallerPreflight $root $runtimeRoot $pythonRoot $nativeRoot $lock
          $mutex = Get-PropExtractInstallerMutex $root
          $held = $false
          try {
            $held = Enter-PropExtractInstallerMutex $mutex
            $oldErrorActionPreference = $ErrorActionPreference
            $ErrorActionPreference = "Continue"
            $startedAt = Get-Date
            $output = & "$env:ComSpec" /d /c "call install_windows.cmd -NoStart" 2>&1 | Out-String
            $exitCode = $LASTEXITCODE
            $elapsed = ((Get-Date) - $startedAt).TotalSeconds
            $ErrorActionPreference = $oldErrorActionPreference
            Write-Host $output
            if ($exitCode -eq 0 -or $elapsed -gt 10) {
              throw "installer mutex did not reject a concurrent install"
            }
          } finally {
            if ($held) { try { $mutex.ReleaseMutex() } catch { } }
            $mutex.Dispose()
          }
          # The rejected child is expected to leave LASTEXITCODE=1. GitHub's
          # PowerShell wrapper returns that value unless this successful probe
          # explicitly clears it; assertion throws above still terminate.
          $global:LASTEXITCODE = 0
      - name: Reject Python and native runtime junctions
        shell: powershell
        run: |
          . .\windows_runtime_helpers.ps1
          $lock = Get-Content .\windows-runtime.lock.json -Raw | ConvertFrom-Json
          $root = (Get-Location).Path
          foreach ($kind in @("python", "native")) {
            $probeParent = Join-Path $root (".runtime-junction-probe-" + $kind)
            $runtimeRoot = Join-Path $probeParent "windows"
            $pythonRoot = Join-Path $runtimeRoot ("python-" + $lock.artifacts.python.version)
            $nativeRoot = Join-Path $runtimeRoot ("native-" + $lock.runtime)
            $outside = Join-Path $env:RUNNER_TEMP ("propextract-junction-target-" + $kind)
            New-Item -ItemType Directory -Path $runtimeRoot -Force | Out-Null
            New-Item -ItemType Directory -Path $outside -Force | Out-Null
            $junction = if ($kind -eq "python") { $pythonRoot } else { $nativeRoot }
            try {
              New-Item -ItemType Junction -Path $junction -Target $outside -ErrorAction Stop | Out-Null
              if (-not (Test-PropExtractTreeContainsReparsePoint $junction)) {
                throw "$kind runtime junction was not detected"
              }
              $rejected = $false
              try {
                Assert-PropExtractInstallerPreflight $root $runtimeRoot $pythonRoot $nativeRoot $lock
              } catch {
                $rejected = $true
              }
              if (-not $rejected) { throw "$kind runtime junction was accepted" }
              $digest = Get-PropExtractDirectoryDigest $junction
              if ($digest.Files -ne 0 -or $digest.Sha256 -ne "") { throw "$kind runtime junction received a valid digest" }
            } finally {
              if (Test-Path -LiteralPath $junction) { Remove-Item -LiteralPath $junction -Force }
              if (Test-Path -LiteralPath $probeParent) { Remove-Item -LiteralPath $probeParent -Recurse -Force }
              if (Test-Path -LiteralPath $outside) { Remove-Item -LiteralPath $outside -Recurse -Force }
            }
          }
      - name: Parse both Windows picker dialogs with PowerShell 5.1
        shell: powershell
        run: |
          $lock = Get-Content .\windows-runtime.lock.json -Raw | ConvertFrom-Json
          $python = ".runtime\windows\python-$($lock.artifacts.python.version)\python.exe"
          $env:PYTHONIOENCODING = "utf-8"
          [Console]::OutputEncoding = New-Object System.Text.UTF8Encoding($false)
          foreach ($kind in @("directory", "xlsx")) {
            try {
              $source = & $python -B -S -c "from rns_import_server.picker import _windows_dialog_script; import sys; print(_windows_dialog_script(sys.argv[1]))" $kind
              if ($LASTEXITCODE -ne 0) { throw "picker script generation failed: $kind" }
              $null = [ScriptBlock]::Create(($source | Out-String))
            } catch {
              $details = $_.Exception.ToString().Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
              Write-Output "::error title=PropExtract Windows picker parse failed::$details"
              throw
            }
          }
      - name: Check same-instance start, double-start, stop, and immediate restart
        shell: powershell
        run: |
          $lock = Get-Content .\windows-runtime.lock.json -Raw | ConvertFrom-Json
          $python = ".runtime\windows\python-$($lock.artifacts.python.version)\python.exe"
          $expectedInstance = (& $python -B -S -c "from rns_import_server.server import project_instance_id; print(project_instance_id())" | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $expectedInstance -notmatch '^[0-9a-f]{64}$') { throw "could not determine instance identity" }
          $server = Start-Process -FilePath $env:ComSpec -ArgumentList @("/d", "/c", "call start_windows.cmd -NoBrowser") -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            foreach ($attempt in 1..30) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8775/health" -TimeoutSec 2
                $health = $response.Content | ConvertFrom-Json
                if ($health.status -eq "ok" -and $health.service -eq "rns-import" -and $response.Headers["X-PropExtract-Instance"] -eq $expectedInstance) { $ready = $true; break }
              } catch { Start-Sleep -Milliseconds 300 }
            }
            if (-not $ready) { throw "server did not become ready" }
            if ($server.HasExited) { throw "initial start exited before lifecycle stop" }
            & "$env:ComSpec" /d /c "call start_windows.cmd -NoBrowser"
            if ($LASTEXITCODE -ne 0) { throw "same-instance second start failed" }
            & .\stop_windows.cmd
            if ($LASTEXITCODE -ne 0) { throw "stop_windows.cmd failed" }
            if (-not $server.WaitForExit(15000)) { throw "server did not stop" }
            $restart = Start-Process -FilePath $env:ComSpec -ArgumentList @("/d", "/c", "call start_windows.cmd -NoBrowser") -PassThru -WindowStyle Hidden
            try {
              $restarted = $false
              foreach ($attempt in 1..30) {
                try {
                  $response = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8775/health" -TimeoutSec 2
                  $health = $response.Content | ConvertFrom-Json
                  if ($health.status -eq "ok" -and $health.service -eq "rns-import" -and $response.Headers["X-PropExtract-Instance"] -eq $expectedInstance) { $restarted = $true; break }
                } catch { Start-Sleep -Milliseconds 300 }
              }
              if (-not $restarted -or $restart.HasExited) { throw "immediate restart did not become healthy" }
              & .\stop_windows.cmd
              if ($LASTEXITCODE -ne 0) { throw "stop after immediate restart failed" }
              if (-not $restart.WaitForExit(15000)) { throw "restarted server did not stop" }
            } finally {
              if (-not $restart.HasExited) { Stop-Process -Id $restart.Id -Force }
            }
          } finally {
            if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }
