name: Windows offline smoke

on:
  push:
    branches:
      - main
      - codex/admin-ui
    paths:
      - ".github/workflows/windows-smoke.yml"
      - "install_windows.*"
      - "start_windows.*"
      - "stop_windows.*"
      - "*PropExtract.cmd"
      - "windows_runtime_helpers.ps1"
      - "windows-runtime.lock.json"
      - "packages/**"
      - "requirements-rns-import.txt"
      - "rns_import_server/**"
      - "scripts/build_windows_*"
      - "tests/test_admin_server.py"
  pull_request:
    paths:
      - ".github/workflows/windows-smoke.yml"
      - "install_windows.*"
      - "start_windows.*"
      - "stop_windows.*"
      - "*PropExtract.cmd"
      - "windows_runtime_helpers.ps1"
      - "windows-runtime.lock.json"
      - "packages/**"
      - "requirements-rns-import.txt"
      - "rns_import_server/**"
      - "scripts/build_windows_*"
      - "tests/test_admin_server.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-install:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run the one-click installer without WinGet or network downloads
        shell: powershell
        run: |
          Remove-Item Env:\PYTHONDONTWRITEBYTECODE, Env:\TESSDATA_PREFIX -ErrorAction SilentlyContinue
          $oldErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          $output = & "$env:ComSpec" /d /c "call install_windows.cmd -NoStart" 2>&1 | Out-String
          $exitCode = $LASTEXITCODE
          $ErrorActionPreference = $oldErrorActionPreference
          Write-Host $output
          if ($exitCode -ne 0) {
            $details = $output
            if (Test-Path -LiteralPath .\install-windows.log -PathType Leaf) {
              $details += "`n--- install-windows.log ---`n"
              $details += (Get-Content -LiteralPath .\install-windows.log -Tail 100 | Out-String)
            }
            $details = $details.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=PropExtract Windows installer failed::$details"
            exit $exitCode
          }
      - name: Re-run a healthy installation
        shell: cmd
        run: install_windows.cmd -NoStart
      - name: Simulate antivirus loss and local corruption
        shell: powershell
        run: |
          $lock = Get-Content .\windows-runtime.lock.json -Raw | ConvertFrom-Json
          $python = ".runtime\windows\python-$($lock.artifacts.python.version)\python312._pth"
          $native = ".runtime\windows\native-$($lock.runtime)"
          $pdfinfo = Join-Path $native (Join-Path $lock.nativeTree.popplerBinPath "pdfinfo.exe")
          [IO.File]::AppendAllText($python, "tamper")
          Remove-Item -LiteralPath $pdfinfo -Force
      - name: Repair both tampered runtimes
        shell: cmd
        run: install_windows.cmd -NoStart
      - name: Verify app-local runtime files and tree digests
        shell: powershell
        run: |
          . .\windows_runtime_helpers.ps1
          $lock = Get-Content .\windows-runtime.lock.json -Raw | ConvertFrom-Json
          $python = Join-Path $PWD (".runtime\windows\python-" + $lock.artifacts.python.version)
          $native = Join-Path $PWD (".runtime\windows\native-" + $lock.runtime)
          if (-not (Test-PropExtractPythonTree $python $lock)) { throw "python tree digest mismatch" }
          if (-not (Test-PropExtractNativeTree $native $lock)) { throw "native tree digest mismatch" }
          $poppler = Join-Path $native $lock.nativeTree.popplerBinPath
          foreach ($name in @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll")) {
            if (-not (Test-Path -LiteralPath (Join-Path $poppler $name) -PathType Leaf)) {
              throw "missing app-local VC runtime file: $name"
            }
          }
      - name: Check the normal CMD launcher without opening a browser
        shell: powershell
        run: |
          $oldErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          $output = & "$env:ComSpec" /d /c "call start_windows.cmd -NoBrowser -CheckOnly" 2>&1 | Out-String
          $exitCode = $LASTEXITCODE
          $ErrorActionPreference = $oldErrorActionPreference
          Write-Host $output
          if ($exitCode -ne 0) {
            $details = $output.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=PropExtract Windows launcher failed::$details"
            exit $exitCode
          }
      - name: Recheck server imports and OCR runtime
        shell: powershell
        run: |
          $lock = Get-Content .\windows-runtime.lock.json -Raw | ConvertFrom-Json
          $python = ".runtime\windows\python-$($lock.artifacts.python.version)\python.exe"
          $env:PYTHONDONTWRITEBYTECODE = "1"
          & $python -B -S -c "import openpyxl, rns_import_server.server"
          if ($LASTEXITCODE -ne 0) { throw "server import failed" }
          & $python -B -S -m rns_import_server.runtime
          if ($LASTEXITCODE -ne 0) { throw "runtime check failed" }
      - name: Parse both Windows picker dialogs with PowerShell 5.1
        shell: powershell
        run: |
          $lock = Get-Content .\windows-runtime.lock.json -Raw | ConvertFrom-Json
          $python = ".runtime\windows\python-$($lock.artifacts.python.version)\python.exe"
          $env:PYTHONIOENCODING = "utf-8"
          [Console]::OutputEncoding = New-Object System.Text.UTF8Encoding($false)
          foreach ($kind in @("directory", "xlsx")) {
            try {
              $source = & $python -B -S -c "from rns_import_server.picker import _windows_dialog_script; import sys; print(_windows_dialog_script(sys.argv[1]))" $kind
              if ($LASTEXITCODE -ne 0) { throw "picker script generation failed: $kind" }
              $null = [ScriptBlock]::Create(($source | Out-String))
            } catch {
              $details = $_.Exception.ToString().Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
              Write-Output "::error title=PropExtract Windows picker parse failed::$details"
              throw
            }
          }
      - name: Check visible start and safe stop lifecycle
        shell: powershell
        run: |
          $lock = Get-Content .\windows-runtime.lock.json -Raw | ConvertFrom-Json
          $python = ".runtime\windows\python-$($lock.artifacts.python.version)\python.exe"
          $server = Start-Process -FilePath $python -ArgumentList @("-B", "-S", "-m", "rns_import_server.app", "serve", "--host", "127.0.0.1", "--port", "8775") -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            foreach ($attempt in 1..30) {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8775/health" -TimeoutSec 2
                if ($health.status -eq "ok") { $ready = $true; break }
              } catch { Start-Sleep -Milliseconds 300 }
            }
            if (-not $ready) { throw "server did not become ready" }
            & .\stop_windows.cmd
            if ($LASTEXITCODE -ne 0) { throw "stop_windows.cmd failed" }
            if (-not $server.WaitForExit(10000)) { throw "server did not stop" }
          } finally {
            if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }
